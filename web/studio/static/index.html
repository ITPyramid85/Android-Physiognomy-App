<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LuckyStar Admin</title>
  <style>
    :root {
      --bg: #07060b;
      --panel: #121018;
      --panel-2: #1b1724;
      --line: #2c2638;
      --text: #f6f1e6;
      --muted: #a89bb8;
      --gold: #c9a449;
      --gold-ink: #2a210c;
      --face: #d7b56d;
      --palm: #8fb9a8;
      --danger: #e07a7a;
      --ok: #8fb9a8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 220px 1fr;
    }
    aside.nav {
      background: #0d0b12;
      border-right: 1px solid var(--line);
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 16px; }
    .mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(160deg, #e6c877, #8e6f2c);
      color: var(--gold-ink); display: grid; place-items: center; font-weight: 800;
    }
    .brand strong { display: block; font-size: 14px; }
    .brand span { color: var(--muted); font-size: 12px; }
    aside.nav button {
      text-align: left; background: transparent; color: var(--muted);
      border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 14px;
    }
    aside.nav button.active, aside.nav button:hover { background: var(--panel-2); color: var(--text); }
    aside.nav button.active { box-shadow: inset 3px 0 0 var(--gold); }
    .workspace { min-width: 0; display: grid; grid-template-rows: 64px 1fr; }
    header.top {
      display: flex; align-items: center; gap: 12px; padding: 0 20px;
      border-bottom: 1px solid var(--line);
    }
    header.top h1 { margin: 0; font-size: 18px; font-weight: 650; }
    header.top input, header.top select {
      background: var(--panel); color: var(--text); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 12px; font-size: 14px;
    }
    header.top input { width: min(360px, 40vw); }
    .grow { flex: 1; }
    main { overflow: auto; padding: 18px 20px 32px; }
    .cards { display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr)); gap: 12px; }
    .card, .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    }
    .card { padding: 14px; }
    .card span { color: var(--muted); font-size: 12px; }
    .card b { display: block; margin-top: 8px; font-size: 26px; font-weight: 650; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    .filters button, .ghost, .danger {
      border-radius: 999px; border: 1px solid var(--line); background: transparent;
      color: var(--text); padding: 6px 12px; cursor: pointer; font-size: 13px;
    }
    .filters button.on { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
    .panel { overflow: auto; }
    table { width: max-content; min-width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; vertical-align: top; }
    th { white-space: nowrap; }
    td { max-width: 360px; }
    th { color: var(--muted); font-weight: 650; background: #16131e; position: sticky; top: 0; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: #1c1826; }
    .muted { color: var(--muted); }
    .badge {
      display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px;
      border: 1px solid var(--line);
    }
    .badge.face { color: var(--face); }
    .badge.palm { color: var(--palm); }
    .empty { padding: 42px 16px; text-align: center; color: var(--muted); }
    .pager { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    .section-title { margin: 22px 0 10px; font-size: 14px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .shot { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; }
    .frame {
      height: 132px; display: grid; place-items: center; font-size: 28px; font-weight: 700;
      background:
        radial-gradient(circle at 50% 30%, rgba(230, 200, 119, .28), transparent 55%),
        linear-gradient(180deg, #241c33, #120f18);
    }
    .frame.palm { background:
        radial-gradient(circle at 50% 30%, rgba(143, 185, 168, .28), transparent 55%),
        linear-gradient(180deg, #18241f, #101410); }
    .shot .meta, .bucket { padding: 12px; }
    .shot .meta div { overflow-wrap: anywhere; }
    .shot .meta strong, .bucket strong { display: block; margin-bottom: 4px; }
    .ok { color: var(--ok); }
    .miss { color: var(--danger); }
    .drawer-back {
      position: fixed; inset: 0 0 0 220px; background: rgba(0,0,0,.35);
    }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw);
      background: #100e16; border-left: 1px solid var(--line); overflow: auto; padding: 20px;
    }
    .drawer h2 { margin: 0 0 6px; font-size: 20px; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; margin: 16px 0; font-size: 13px; }
    .kv span { color: var(--muted); }
    .body {
      white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px; line-height: 1.55; font-size: 14px;
    }
    .thread { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .bubble { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--panel); }
    .bubble .who { color: var(--gold); font-size: 12px; margin-bottom: 4px; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .danger { color: var(--danger); border-color: #5a3030; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
    @media (max-width: 1100px) {
      .cards { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; }
      aside.nav { flex-direction: row; overflow: auto; }
      .drawer-back { left: 0; }
    }
  </style>
</head>

      filter: "",
      offset: 0,
      limit: 30
    };

    const main = document.getElementById("main");

    const langSelect = document.getElementById("lang");

    function t(key) { return (I18N[state.lang] || I18N.ko)[key] || key; }
    function fmt(iso) {
      if (!iso) return "—";
      const map = { ko: "ko-KR", en: "en-US", ja: "ja-JP", zh: "zh-CN" };
      return new Intl.DateTimeFormat(map[state.lang], { dateStyle: "medium", timeStyle: "short" }).format(new Date(iso));
    }
    function person(row) { return row.display_name || row.email || t("unknown"); }
    function typeLabel(type) { return type === "palm" ? t("palm") : type === "face" ? t("face") : (type || "—"); }
    function kindLabel(kind) { return t(kind === "reading" || kind === "consultation" || kind === "message" ? kind : "kind"); }
    function badge(type) {
      const span = document.createElement("span");
      span.className = "badge " + (type === "palm" ? "palm" : "face");
      span.textContent = typeLabel(type);
      return span;
    }
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function applyChrome() {
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : state.lang;
      document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = t(node.dataset.i18n); });
      title.textContent = t("title_" + state.view);
      search.placeholder = t("search");
      search.hidden = state.view === "overview" || state.view === "images";
      langSelect.value = state.lang;
    }
    async function api(path, options) {
      const res = await fetch(path, options);
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || "load_error");
      return body;
    }
    function qs(extra) {
      const params = new URLSearchParams();
      if (state.q) params.set("q", state.q);
      if (state.filter) params.set(extra.filterKey || "type", state.filter);
      if (extra.kind) params.set("kind", state.filter);
      params.set("limit", String(state.limit));
      params.set("offset", String(state.offset));
      return params.toString();
    }
    function empty(key) { main.appendChild(el("div", "empty", t(key))); }
    function table(headers, rows, onClick) {
      const wrap = el("div", "panel");
      const grid = document.createElement("table");
      const head = document.createElement("tr");
      headers.forEach((header) => head.appendChild(el("th", "", header)));
      const thead = document.createElement("thead");
      thead.appendChild(head);
      const tbody = document.createElement("tbody");
      rows.forEach((cells) => {
        const tr = document.createElement("tr");
        if (onClick) {
          tr.className = "clickable";
          tr.setAttribute("role", "button");
          tr.tabIndex = 0;
        }
        cells.forEach((cell) => {
          const td = document.createElement("td");
          if (cell instanceof Node) td.appendChild(cell);
          else td.textContent = cell ?? "—";
          tr.appendChild(td);
        });
        if (onClick) tr.onclick = () => onClick(tr);
        tbody.appendChild(tr);
      });
      grid.append(thead, tbody);
      wrap.appendChild(grid);
      return wrap;
    }
    function pager(total) {
      const bar = el("div", "pager");
      const prev = el("button", "ghost", t("prev"));
      const next = el("button", "ghost", t("next"));
      prev.disabled = state.offset <= 0;
      next.disabled = state.offset + state.limit >= total;
      prev.onclick = () => { state.offset = Math.max(0, state.offset - state.limit); render(); };
      next.onclick = () => { state.offset += state.limit; render(); };
      bar.append(prev, el("span", "muted", t("count").replace("{n}", String(total))), next);
      return bar;
    }
    function filters(options) {
      const bar = el("div", "filters");
      options.forEach(([value, label]) => {
        const button = el("button", state.filter === value ? "on" : "", label);
        button.onclick = () => { state.filter = value; state.offset = 0; render(); };
        bar.appendChild(button);
      });
      main.appendChild(bar);
    }
    function closeDrawer() {
      document.getElementById("drawer-back")?.remove();
    }
    function openDrawer(node) {
      closeDrawer();
      const back = el("div", "drawer-back");
      back.id = "drawer-back";
      back.onclick = (event) => { if (event.target === back) closeDrawer(); };
      const drawer = el("div", "drawer");
      drawer.onclick = (event) => event.stopPropagation();
      const close = el("button", "ghost", t("close"));
      close.onclick = closeDrawer;
      drawer.append(close, node);
      back.appendChild(drawer);
      document.body.appendChild(back);
    }
    function kv(pairs) {
      const grid = el("div", "kv");
      pairs.forEach(([label, value]) => {
        grid.append(el("span", "", label), el("div", "", value || "—"));
      });
      return grid;
    }
    async function removeRecord(kind, id, name) {
      const message = t("confirm_" + kind).replace("{name}", name || id);
      if (!window.confirm(message)) return;
      await api("/api/admin/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kind, id })
      });
      closeDrawer();
      render();
    }
    function deleteButton(kind, id, name) {
      const button = el("button", "danger", t("delete"));
      button.onclick = () => removeRecord(kind, id, name);
      return button;
    }

    async function showUser(id) {
      const data = await api("/api/admin/users?id=" + encodeURIComponent(id));
      const user = data.user;
      const box = el("div");
      box.append(el("h2", "", person(user)));
      box.append(kv([
        [t("email"), user.email || "—"],
        [t("locale"), user.locale || "—"],
        [t("joined"), fmt(user.created_at)],
        [t("stat_face"), String(user.face_count)],
        [t("stat_palm"), String(user.palm_count)],
        [t("consultations"), String(user.consultation_count)],
        [t("last"), fmt(user.last_reading_at)]
      ]));
      box.append(el("h3", "section-title", t("title_results")));
      if (!data.readings.length) box.append(el("div", "empty", t("empty_results")));
      else data.readings.forEach((row) => {
        const line = el("div", "bubble");
        line.append(badge(row.type), document.createTextNode(" " + (row.subject_name || t("unknown")) + " · " + fmt(row.created_at)));
        line.append(el("div", "muted", row.excerpt || ""));
        line.style.cursor = "pointer";
        line.onclick = () => showReading(row.id);
        box.append(line);
      });
      const actions = el("div", "actions");
      actions.appendChild(deleteButton("user", user.id, person(user)));
      box.append(actions);
      openDrawer(box);
    }

    async function showReading(id) {
      const data = await api("/api/admin/readings?id=" + encodeURIComponent(id));
      const row = data.reading;
      const box = el("div");
      box.append(el("h2", "", row.subject_name || t("unknown")));
      box.append(badge(row.type));
      box.append(kv([
        [t("user"), person(row)],
        [t("model"), row.model_used || "—"],
        [t("locale"), row.locale || "—"],
        [t("when"), fmt(row.created_at)],
        [t("path"), row.image_path || t("no_path")],
        [t("stored_at"), row.object_id ? fmt(row.stored_at) : t("file_missing")]
      ]));
      box.append(el("h3", "section-title", t("result_body")));
      box.append(el("div", "body", row.result_text || ""));
      box.append(el("h3", "section-title", t("linked")));
      if (!data.consultations.length) box.append(el("div", "empty", t("empty_consultations")));
      else data.consultations.forEach((item) => {
        const line = el("div", "bubble");
        line.style.cursor = "pointer";
        line.textContent = (item.title || t("untitled")) + " · " + fmt(item.created_at);
        line.onclick = () => showConsultation(item.id);
        box.append(line);
      });
      const actions = el("div", "actions");
      actions.appendChild(deleteButton("reading", row.id, row.subject_name || person(row)));
      box.append(actions);
      openDrawer(box);
    }

    async function showConsultation(id) {
      const data = await api("/api/admin/consultations?id=" + encodeURIComponent(id));
      const row = data.consultation;
      const box = el("div");
      box.append(el("h2", "", row.title || t("untitled")));
      box.append(badge(row.analysis_type));
      box.append(kv([
        [t("user"), person(row)],
        [t("subject"), row.subject_name || "—"],
        [t("model"), row.model_used || "—"],
        [t("locale"), row.locale || "—"],
        [t("when"), fmt(row.created_at)],
        [t("messages"), String(row.message_count)]
      ]));
      box.append(el("h3", "section-title", t("result_body")));
      box.append(el("div", "body", row.context_summary || ""));
      if (row.context_features && Object.keys(row.context_features).length) {
        box.append(el("h3", "section-title", t("features")));
        box.append(el("div", "body", JSON.stringify(row.context_features, null, 2)));
      }
      box.append(el("h3", "section-title", t("thread")));
      const thread = el("div", "thread");
      if (!data.messages.length) thread.append(el("div", "empty", t("empty_messages")));
      data.messages.forEach((message) => {
        const bubble = el("div", "bubble");
        const who = message.role === "assistant" ? t("role_assistant") : t("role_user");
        bubble.append(el("div", "who", who + " · " + fmt(message.created_at) + (message.token_count != null ? " · " + message.token_count + " " + t("tokens") : "")));
        bubble.append(el("div", "", message.content || ""));
        thread.append(bubble);
      });
      box.append(thread);
      const actions = el("div", "actions");
      actions.appendChild(deleteButton("consultation", row.id, row.title || row.subject_name || person(row)));
      if (row.analysis_id) {
        const openReading = el("button", "ghost", t("title_results"));
        openReading.onclick = () => showReading(row.analysis_id);
        actions.appendChild(openReading);
      }
      box.append(actions);
      openDrawer(box);
    }

    async function renderOverview() {
      const data = await api("/api/admin/summary");
      const s = data.summary;
      const cards = el("div", "cards");
      [
        ["stat_users", s.users], ["stat_face", s.face_readings], ["stat_palm", s.palm_readings],
        ["stat_images", s.stored_files], ["stat_consultations", s.consultations], ["stat_messages", s.messages]
      ].forEach(([key, value]) => {
        const card = el("div", "card");
        card.append(el("span", "", t(key)), el("b", "", String(value)));
        cards.append(card);
      });
      main.append(cards, el("h2", "section-title", t("recent")));
      if (!data.activity.length) { empty("empty_activity"); return; }
      main.append(table(
        [t("when"), t("kind"), t("user"), t("excerpt")],
        data.activity.map((row) => [fmt(row.created_at), kindLabel(row.kind), person(row), row.excerpt || row.title || "—"])
      ));
    }

    async function renderUsers() {
      const data = await api("/api/admin/users?" + qs({}));
      if (!data.items.length) { empty("empty_users"); return; }
      const rows = data.items.map((row) => {
        const cells = [person(row), row.email || "—", row.locale || "—", String(row.face_count), String(row.palm_count), String(row.consultation_count), fmt(row.created_at)];
        cells.row = row;
        return cells;
      });
      main.append(table(
        [t("user"), t("email"), t("locale"), t("face"), t("palm"), t("consultations"), t("joined")],
        rows,
        (tr) => showUser(rows[tr.sectionRowIndex].row.id)
      ));
      main.append(pager(data.total));
    }

    async function renderActivity() {
      filters([["", t("all")], ["reading", t("reading")], ["consultation", t("consultation")], ["message", t("message")]]);
      const params = new URLSearchParams({ kind: state.filter, limit: String(state.limit), offset: String(state.offset) });
      const data = await api("/api/admin/activity?" + params.toString());
      if (!data.items.length) { empty("empty_activity"); return; }
      const rows = data.items.map((row) => {
        const cells = [fmt(row.created_at), kindLabel(row.kind), badge(row.subtype === "palm" || row.subtype === "face" ? row.subtype : "face"), person(row), row.title || "—", row.excerpt || "—"];
        if (row.subtype !== "face" && row.subtype !== "palm") cells[2] = row.subtype || "—";
        cells.row = row;
        return cells;
      });
      main.append(table(
        [t("when"), t("kind"), t("subject"), t("user"), t("subject"), t("excerpt")],
        rows,
        (tr) => {
          const row = rows[tr.sectionRowIndex].row;
          if (row.kind === "reading") showReading(row.id);
          else if (row.kind === "consultation") showConsultation(row.id);
          else if (row.user_id) showUser(row.user_id);
        }
      ));
      main.append(pager(data.total));
    }

    async function renderResults() {
      filters([["", t("all")], ["face", t("face")], ["palm", t("palm")]]);
      const data = await api("/api/admin/readings?" + qs({}));
      if (!data.items.length) { empty("empty_results"); return; }
      const rows = data.items.map((row) => {
        const cells = [fmt(row.created_at), badge(row.type), row.subject_name || t("unknown"), person(row), row.model_used || "—", row.locale || "—", row.excerpt || "—"];
        cells.row = row;
        return cells;
      });
      main.append(table(
        [t("when"), t("kind"), t("subject"), t("user"), t("model"), t("locale"), t("excerpt")],
        rows,
        (tr) => showReading(rows[tr.sectionRowIndex].row.id)
      ));
      main.append(pager(data.total));
    }

    async function renderImages() {
      filters([["", t("all")], ["face", t("face")], ["palm", t("palm")], ["stored", t("stored")], ["missing", t("missing")]]);
      const data = await api("/api/admin/images?type=" + encodeURIComponent(state.filter));
      if (data.bucket) {
        const bucket = el("div", "bucket panel");
        const title = el("strong", "", data.bucket.name);
        const meta = el("div", "muted", [
          data.bucket.public ? t("bucket_public") : t("bucket_private"),
          t("limit") + " " + Math.round(data.bucket.file_size_limit / 1048576) + "MB",
          t("mime") + " " + (data.bucket.allowed_mime_types || []).join(", ")
        ].join(" · "));
        bucket.append(title, meta);
        main.append(bucket);
      }
      if (!data.items.length) empty("empty_images");
      else {
        const gallery = el("div", "gallery");
        data.items.forEach((row) => {
          const card = el("article", "shot");
          card.setAttribute("role", "button");
          card.tabIndex = 0;
          const frame = el("div", "frame" + (row.type === "palm" ? " palm" : ""), typeLabel(row.type));
          const meta = el("div", "meta");
          meta.append(el("strong", "", row.subject_name || t("unknown")));
          meta.append(el("div", "muted", person(row) + " · " + fmt(row.created_at)));
          meta.append(el("div", "", row.image_path || t("no_path")));
          meta.append(el("div", row.has_file ? "ok" : "miss", row.has_file ? t("file_stored") : t("file_missing")));
          card.append(frame, meta);
          card.onclick = () => showReading(row.reading_id);
          gallery.append(card);
        });
        main.append(gallery);
      }
      main.append(el("h2", "section-title", t("orphan_title")));
      if (!data.orphans.length) empty("empty_orphans");
      else {
        const rows = data.orphans.map((row) => {
          const cells = [row.name, person(row), fmt(row.created_at)];
          cells.row = row;
          return cells;
        });
        main.append(table([t("path"), t("owner"), t("stored_at")], rows, (tr) => {
          const row = rows[tr.sectionRowIndex].row;
          removeRecord("object", row.id, row.name);
        }));
      }
    }

    async function renderConsultations() {
      filters([["", t("all")], ["face", t("face")], ["palm", t("palm")]]);
      const data = await api("/api/admin/consultations?" + qs({}));
      if (!data.items.length) { empty("empty_consultations"); return; }
      const rows = data.items.map((row) => {
        const cells = [fmt(row.last_message_at || row.created_at), badge(row.analysis_type), row.title || t("untitled"), row.subject_name || "—", person(row), String(row.message_count), row.model_used || "—"];
        cells.row = row;
        return cells;
      });
      main.append(table(
        [t("when"), t("kind"), t("subject"), t("subject"), t("user"), t("messages"), t("model")],
        rows,
        (tr) => showConsultation(rows[tr.sectionRowIndex].row.id)
      ));
      main.append(pager(data.total));
    }

    const views = {
      overview: renderOverview,
      users: renderUsers,
      activity: renderActivity,
      results: renderResults,
      images: renderImages,
      consultations: renderConsultations
    };

    async function render() {
      applyChrome();
      main.replaceChildren();
      try { await views[state.view](); }
      catch (error) { main.append(el("div", "empty", t("load_error"))); }
    }

    document.querySelectorAll("aside.nav button").forEach((button) => {
      button.onclick = () => {
        document.querySelectorAll("aside.nav button").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        state.view = button.dataset.view;
        state.filter = "";
        state.offset = 0;
        state.q = "";
        search.value = "";
        closeDrawer();
        render();
      };
    });
    let timer = 0;
    search.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => { state.q = search.value.trim(); state.offset = 0; render(); }, 250);
    });
    langSelect.onchange = () => {
      state.lang = langSelect.value;
      localStorage.setItem("luckystar_admin_lang", state.lang);
      render();
    };
    langSelect.value = state.lang;
    render();
  </script>
</body>
</html>
